name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (JS syntax + asset manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No build step and no bundler: voyage_manager.html is hand-edited, so a syntax
      # error in an inline <script> would otherwise reach a phone before anyone noticed.
      - name: Check JavaScript parses
        run: node tests/check_js_syntax.js

      - name: Check e-ORB scenarios and weekly inventory window
        run: node tests/test_eorb.js

      - name: Check ship's clock / timezone change hours
        run: node tests/test_clock_change.js

      - name: Check voyage-start time zone reference
        run: node tests/test_voyage_init_tz.js

      - name: Check stale ship_time.js does not crash startup
        run: node tests/test_shiptime_compat.js

      - name: Check flowmeter and fresh-water consumption formulas
        run: node tests/test_flow_cons.js

      - name: Check noon print title and flag registry
        run: node tests/test_noon_print.js

      - name: Check device enrollment helpers
        run: node tests/test_device_enrollment.js

      - name: Check login-gate theme contrast tokens
        run: node tests/test_login_theme.js

  sync-server:
    name: Sync server (auth matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile server
        run: python3 -m py_compile sync-server/server.py

      # Starts server.py with and without SYNC_API_TOKEN and asserts who gets in.
      # Guards the regression where a token-less server rejected the correct token.
      - name: Run auth matrix
        run: python3 tests/test_sync_auth.py

      # Logins, derived vessel tokens, and the rule that one login reaches
      # exactly one vessel.
      - name: Run account database matrix
        run: python3 tests/test_accounts.py

  install-scripts:
    name: Install scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These run as root on a Proxmox host and are piped straight from curl to bash,
      # so a quoting slip is expensive and never seen in review.
      - name: Shellcheck
        run: shellcheck install/proxmox-install.sh install/proxmox-update.sh scripts/build-pc-portable.sh tests/test_install_quoting.sh

      # A token with a space or a % used to reach server.py truncated, leaving it on
      # its default token — rejecting the very token the installer printed. Checked
      # against systemd's own parser via systemd-analyze.
      - name: Check token quoting survives systemd
        run: bash tests/test_install_quoting.sh
